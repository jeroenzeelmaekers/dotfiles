[manager]
cwd = { fg = "#df8e1d" }

# Find
find_keyword = { fg = "#df8e1d", bold = true }
find_position = { fg = "#8839ef", italic = true }

# Marker
marker_copied = { fg = "#40a02b", bg = "#40a02b" }
marker_cut = { fg = "#d20f39", bg = "#d20f39" }
marker_marked = { fg = "#1e66f5", bg = "#1e66f5" }
marker_selected = { fg = "#df8e1d", bg = "#df8e1d" }

# Count
count_copied = { fg = "#eff1f5", bg = "#40a02b" }
count_cut = { fg = "#eff1f5", bg = "#d20f39" }
count_selected = { fg = "#eff1f5", bg = "#df8e1d" }

# Border
border_symbol = "│"
border_style = { fg = "#8c8fa1" }
syntect_theme = "~/.config/yazi/flavors/catppuccin-latte.yazi/tmtheme.xml"

[indicator]
parent = { fg = "#8c8fa1", bg = "#eff1f5" }
current = { fg = "#4c4f69", bg = "#ccd0da" }
preview = { fg = "#8c8fa1", bg = "#eff1f5" }
padding = { open = "█", close = "█" }

[mode]
normal_main = { fg = "#eff1f5", bg = "#1e66f5", bold = true }
normal_alt = { fg = "#1e66f5", bg = "#ccd0da" }

select_main = { fg = "#eff1f5", bg = "#40a02b", bold = true }
select_alt = { fg = "#40a02b", bg = "#ccd0da" }

unset_main = { fg = "#eff1f5", bg = "#8839ef", bold = true }
unset_alt = { fg = "#8839ef", bg = "#ccd0da" }

[status]
overall = { fg = "#4c4f69", bg = "#ccd0da" }

sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }

# Permissions
perm_type = { fg = "#1e66f5" }
perm_read = { fg = "#df8e1d" }
perm_write = { fg = "#d20f39" }
perm_exec = { fg = "#40a02b" }
perm_sep = { fg = "#8c8fa1" }

# Progress
progress_label = { fg = "#4c4f69", bold = true }
progress_normal = { fg = "#1e66f5", bg = "#ccd0da" }
progress_error = { fg = "#d20f39", bg = "#ccd0da" }

[tabs]
active = { fg = "#eff1f5", bg = "#6c6f85" }
inactive = { fg = "#4c4f69", bg = "#ccd0da" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[pick]
border = { fg = "#1e66f5" }
active = { fg = "#8839ef", bold = true }
inactive = { fg = "#4c4f69" }

[input]
border = { fg = "#1e66f5" }
title = { fg = "#4c4f69" }
value = { fg = "#4c4f69" }
selected = { reversed = true }

[cmp]
border = { fg = "#1e66f5" }
active = { fg = "#8839ef", bold = true }
inactive = { fg = "#4c4f69" }
icon_file = ""
icon_folder = ""
icon_command = ""

[tasks]
border = { fg = "#1e66f5" }
title = { fg = "#4c4f69" }
hovered = { fg = "#8839ef", underline = true }

[which]
cols = 3
mask = { bg = "#eff1f5" }
cand = { fg = "#179299" }
rest = { fg = "#8c8fa1" }
desc = { fg = "#8839ef" }
separator = " -> "
separator_style = { fg = "#8c8fa1" }

[help]
on = { fg = "#179299" }
run = { fg = "#8839ef" }
desc = { fg = "#4c4f69" }
hovered = { bg = "#ccd0da", bold = true }
footer = { fg = "#8c8fa1", bg = "#eff1f5" }

[confirm]
border = { fg = "#1e66f5" }
title = { fg = "#4c4f69" }
body = { fg = "#4c4f69" }
list = { fg = "#4c4f69" }
btn_yes = { fg = "#eff1f5", bg = "#40a02b", bold = true }
btn_no = { fg = "#eff1f5", bg = "#d20f39", bold = true }
btn_labels = ["Yes", "No"]

[spot]
border = { fg = "#1e66f5" }
title = { fg = "#4c4f69" }
tbl_col = { fg = "#8839ef" }
tbl_cell = { fg = "#4c4f69" }

[notify]
title_info = { fg = "#40a02b" }
title_warn = { fg = "#df8e1d" }
title_error = { fg = "#d20f39" }

[filetype]
rules = [
  # Images
  { mime = "image/*", fg = "#df8e1d" },

  # Media
  { mime = "{audio,video}/*", fg = "#8839ef" },

  # Archives
  { mime = "application/{zip,gzip,x-tar,x-bzip*,x-7z-compressed,x-rar}", fg = "#d20f39" },

  # Documents
  { mime = "application/pdf", fg = "#d20f39" },
  { mime = "application/{msword,vnd.openxmlformats*}", fg = "#1e66f5" },

  # Fallbacks
  { url = "*/", fg = "#1e66f5" },
]
