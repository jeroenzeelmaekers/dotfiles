onboarding = false

[keys]
prefix = "ctrl+b"
reload_config = "prefix+r"
resize_mode = ""
new_tab = "prefix+c"
split_vertical = "prefix+|"
split_horizontal = "prefix+minus"
navigate_workspace_up = ["up", "k"]
navigate_workspace_down = ["down", "j"]

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"

[theme]
name = "terminal"
auto_switch = true
dark_name = "terminal"
light_name = "terminal"

[theme.custom.dark]
accent = "#C1A78E"
panel_bg = "#292522"
sidebar_bg = "#292522"
active_row_bg = "#34302C"
selection_bg = "#403A36"
surface0 = "#34302C"
surface1 = "#403A36"
surface_dim = "#292522"
overlay0 = "#867462"
overlay1 = "#C1A78E"
text = "#ECE1D7"
subtext0 = "#C1A78E"
mauve = "#B380B0"
green = "#78997A"
yellow = "#EBC06D"
red = "#BD8183"
blue = "#7F91B2"
teal = "#7B9695"
peach = "#E49B5D"

[theme.custom.light]
accent = "#A06D00"
panel_bg = "#F1F1F1"
sidebar_bg = "#F1F1F1"
active_row_bg = "#E9E1DB"
selection_bg = "#D9D3CE"
surface0 = "#E9E1DB"
surface1 = "#D9D3CE"
surface_dim = "#F1F1F1"
overlay0 = "#A98A78"
overlay1 = "#7D6658"
text = "#54433A"
subtext0 = "#7D6658"
mauve = "#BE79BB"
green = "#6E9B72"
yellow = "#A06D00"
red = "#C77B8B"
blue = "#7892BD"
teal = "#739797"
peach = "#BC5C00"

[ui]
sidebar_collapsed_mode = "compact"
status_indicators = "symbols"

[ui.sound]
enabled = false
